<svg xmlns="http://www.w3.org/2000/svg" width="820" height="368" viewBox="0 0 820 368" role="img" aria-label="陣列與正規化表在低基數與高基數下的總佔用比較：1.11 對 2.70 MB、2.64 對 2.74 MB">
  <style>
    .title { font: 700 17px "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #1f2328; }
    .axis { font: 400 12px "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #5b6673; }
    .val { font: 600 12px "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #1f2328; }
    .grp { font: 600 12px "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #1f2328; }
    .note { font: 600 12px "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #2f6fed; }
    .grid { stroke: #e3e7ec; stroke-width: 1; }
    .base { stroke: #b9c0c9; stroke-width: 1.2; }
  </style>

  <rect x="0" y="0" width="820" height="368" fill="#ffffff"/>

  <text class="title" x="20" y="30">同樣 60 萬個 (event, tag) 配對：總佔用（MB）</text>

  <!-- 圖例 -->
  <rect x="600" y="46" width="14" height="14" rx="3" fill="#7aa2f7"/>
  <text class="axis" x="620" y="57">ARRAY[VARCHAR]</text>
  <rect x="716" y="46" width="14" height="14" rx="3" fill="#c9ced6"/>
  <text class="axis" x="736" y="57">正規化子表</text>

  <!-- 網格 -->
  <line class="grid" x1="110" y1="92"  x2="780" y2="92"/>
  <line class="grid" x1="110" y1="160" x2="780" y2="160"/>
  <line class="grid" x1="110" y1="228" x2="780" y2="228"/>
  <line class="base" x1="110" y1="296" x2="780" y2="296"/>

  <text class="axis" x="100" y="96"  text-anchor="end">3.0</text>
  <text class="axis" x="100" y="164" text-anchor="end">2.0</text>
  <text class="axis" x="100" y="232" text-anchor="end">1.0</text>
  <text class="axis" x="100" y="300" text-anchor="end">0</text>
  <text class="axis" x="20" y="96">MB</text>

  <!-- 低基數：1.11 vs 2.70 -->
  <rect x="200" y="220" width="80" height="76"  rx="3" fill="#7aa2f7"/>
  <rect x="292" y="112" width="80" height="184" rx="3" fill="#c9ced6"/>
  <text class="val" x="240" y="212" text-anchor="middle">1.11</text>
  <text class="val" x="332" y="104" text-anchor="middle">2.70</text>

  <!-- 高基數：2.64 vs 2.74 -->
  <rect x="510" y="116" width="80" height="180" rx="3" fill="#7aa2f7"/>
  <rect x="602" y="110" width="80" height="186" rx="3" fill="#c9ced6"/>
  <text class="val" x="550" y="108" text-anchor="middle">2.64</text>
  <text class="val" x="642" y="102" text-anchor="middle">2.74</text>

  <text class="grp"  x="286" y="320" text-anchor="middle">低基數：20 個相異標籤</text>
  <text class="note" x="286" y="340" text-anchor="middle">ARRAY 少 59%（2.44 倍）</text>

  <text class="grp"  x="596" y="320" text-anchor="middle">高基數：60 萬個唯一標籤</text>
  <text class="note" x="596" y="340" text-anchor="middle">只差 3.9%，每值貴 13.7%</text>
</svg>
