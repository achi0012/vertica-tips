<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-label="TIMESERIES gap filling: 4 raw rows become 7 slices; constant holds the previous value, linear interpolates">
  <title>Vertica TIMESERIES slice boundaries and interpolation</title>
  <style>
    text { font-family: "Noto Sans CJK TC","Source Han Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; fill: #1f2328; }
    .h1 { font-size: 18px; font-weight: 700; }
    .sub { font-size: 13px; fill: #57606a; }
    .ax { font-size: 12px; fill: #57606a; }
    .val { font-size: 12px; fill: #1f2328; }
    .leg { font-size: 13px; }
    .note { font-size: 12px; fill: #57606a; }
  </style>
  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>

  <text class="h1" x="20" y="30">TIMESERIES 補洞：4 筆原始資料 → 7 個 slice</text>
  <text class="sub" x="20" y="54">Vertica 25.4.0-0 · article_lab_ts.tiny · slice = 5 minutes · 原始溫度 20 / 21 / 23 / 26</text>

  <!-- empty slices: 00:10-00:15, 00:20-00:25, 00:25-00:30 -->
  <rect x="323.3" y="70" width="116.7" height="230" fill="#f2f4f7"/>
  <rect x="556.7" y="70" width="116.7" height="230" fill="#f2f4f7"/>
  <rect x="673.4" y="70" width="116.6" height="230" fill="#f2f4f7"/>
  <text class="ax" x="381.7" y="84" text-anchor="middle">無資料</text>
  <text class="ax" x="731.7" y="84" text-anchor="middle">無資料</text>

  <!-- y grid -->
  <line x1="90" y1="86.4" x2="790" y2="86.4" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="90" y1="152.1" x2="790" y2="152.1" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="90" y1="217.9" x2="790" y2="217.9" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="90" y1="283.6" x2="790" y2="283.6" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <text class="ax" x="80" y="90" text-anchor="end">26</text>
  <text class="ax" x="80" y="156" text-anchor="end">24</text>
  <text class="ax" x="80" y="222" text-anchor="end">22</text>
  <text class="ax" x="80" y="288" text-anchor="end">20</text>

  <!-- axis -->
  <line x1="90" y1="300" x2="790" y2="300" stroke="#8c959f" stroke-width="1.5"/>

  <!-- constant (default): 20,21,21,23,23,23,26 -->
  <path d="M90,283.6 L206.7,283.6 L206.7,250.7 L440,250.7 L440,185 L673.3,185 L673.3,86.4 L790,86.4"
        fill="none" stroke="#1f5fa8" stroke-width="2.5"/>

  <!-- linear: 20,21,22,23,24,25,26 -->
  <path d="M90,283.6 L206.7,250.7 L323.3,217.9 L440,185 L556.7,152.1 L673.3,119.3 L790,86.4"
        fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 4"/>

  <!-- raw data points -->
  <circle cx="90" cy="283.6" r="4.5" fill="#1f2328"/>
  <circle cx="206.7" cy="250.7" r="4.5" fill="#1f2328"/>
  <circle cx="440" cy="185" r="4.5" fill="#1f2328"/>
  <circle cx="790" cy="86.4" r="4.5" fill="#1f2328"/>
  <text class="val" x="100" y="277">20</text>
  <text class="val" x="216.7" y="244">21</text>
  <text class="val" x="450" y="178">23</text>
  <text class="val" x="780" y="78" text-anchor="end">26</text>

  <!-- x labels -->
  <text class="ax" x="90" y="322" text-anchor="middle">00:00</text>
  <text class="ax" x="206.7" y="322" text-anchor="middle">00:05</text>
  <text class="ax" x="323.3" y="322" text-anchor="middle">00:10</text>
  <text class="ax" x="440" y="322" text-anchor="middle">00:15</text>
  <text class="ax" x="556.7" y="322" text-anchor="middle">00:20</text>
  <text class="ax" x="673.3" y="322" text-anchor="middle">00:25</text>
  <text class="ax" x="790" y="322" text-anchor="middle">00:30</text>

  <!-- legend -->
  <line x1="90" y1="344" x2="126" y2="344" stroke="#1f5fa8" stroke-width="2.5"/>
  <text class="leg" x="134" y="348">constant（預設）：沿用前一筆 20→21→21→23→23→23→26</text>
  <line x1="90" y1="366" x2="126" y2="366" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text class="leg" x="134" y="370">linear：slice 起點的值 20→21→22→23→24→25→26</text>
  <circle cx="108" cy="388" r="4.5" fill="#1f2328"/>
  <text class="note" x="134" y="392">原始資料點（4 筆落在 5 分鐘網格上，其餘 3 格為補出）</text>
</svg>
